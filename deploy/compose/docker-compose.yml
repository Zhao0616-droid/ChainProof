name: chainproof

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    volumes:
      - ./data:/app/data
    env_file:
      - path: ../../.env
        required: false
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
